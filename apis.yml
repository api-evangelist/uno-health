aid: uno-health
name: Uno Health
description: >-
  Uno Health is a New York-based healthcare technology company that helps
  Medicare members enroll in the government assistance programs they are
  eligible for — such as SNAP and utility assistance — saving members an
  average of $4,500 per year. Medicare Advantage health plans partner with
  Uno's technology-driven member engagement platform to simplify eligibility
  checks, subsidy enrollment, plan optimization, and benefits matching,
  increasing Part C revenue, member retention, and star ratings. Members run a
  5-minute savings check, upload enrollment documents, and track recurring
  monthly savings through the Uno Health Member Portal. Backed by Cowboy
  Ventures and General Catalyst. Uno Health publishes no public developer
  program; its API (api.unohealth.com, AWS API Gateway) is private and
  partner-facing.
